<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orb Agent</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background:
        radial-gradient(circle at 25% 35%, var(--c1), transparent 45%),
        radial-gradient(circle at 75% 65%, var(--c2), transparent 45%),
        var(--base); 
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 80px;
      font-family: system-ui, sans-serif;
    }

    .orb {
  position: relative;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  overflow: hidden;
  background: radial-gradient(circle at 33% 25%,
    rgba(255, 55, 255, 0.35) 0%,
    rgba(25, 255, 25, 0.06) 35%,
    rgba(80, 16, 255, 0.12) 65%,
    rgba(20, 70, 10, 0.4) 100%);
  backdrop-filter: blur(8px) saturate(1.6);
  -webkit-backdrop-filter: blur(8px) saturate(1.6);
  background:
  radial-gradient(circle at 32% 26%, rgba(255, 255, 255, 0.28) 0%, rgba(255, 255, 255, 0) 30%),
  radial-gradient(circle at 62% 90%, rgba(120, 210, 255, 0.55) 0%, rgba(120, 210, 255, 0) 40%),
  radial-gradient(circle at 35% 30%, rgba(120, 190, 255, 0.22) 0%, rgba(30, 90, 220, 0.3) 50%, rgba(5, 20, 80, 0.75) 100%);
  box-shadow:
  inset -20px -26px 45px rgba(0, 10, 60, 0.6),
  inset 14px 14px 30px rgba(190, 230, 255, 0.35),
  0 0 60px rgba(60, 140, 255, 0.35),
  0 30px 50px rgba(0, 10, 50, 0.55);
  transition: box-shadow 0.6s ease, translate 0.25s ease-out, filter 0.3s ease;
  translate: calc(var(--mx, 0) * 14px) calc(var(--my, 0) * 14px);
}
.orb.typing { filter: brightness(1.25) saturate(1.2); }
.ripple {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 220px;
  height: 220px;
  margin: -110px;
  border-radius: 50%;
  border: 2px solid rgba(143, 220, 255, 0.7);
  pointer-events: none;
  animation: rippleOut 0.9s ease-out forwards;
}
@keyframes rippleOut {
  from { transform: scale(1); opacity: 0.8 }
  to { transform: scale(2.6); opacity: 0 }
}

/* soft blue light drifting inside the glass */
.orb::before {
  content: "";
  position: absolute;
  inset: 12%;
  border-radius: 50%;
  background: conic-gradient(from 0deg,
    transparent, rgba(90, 190, 255, 0.55), transparent 35%,
    rgba(60, 120, 255, 0.5), transparent 75%);
  filter: blur(18px);
  animation: spin 9s linear infinite;
}

/* glossy reflection on the top-left */
.orb::after {
  content: "";
  position: absolute;
  top: 7%;
  left: 12%;
  width: 46%;
  height: 26%;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(255, 255, 255, 0.75), transparent 70%);
  filter: blur(3px);
  transform: rotate(-28deg);
}

    /* states */
    .orb[data-state="idle"] {
      animation: breathe 5s ease-in-out infinite;
    }

    .orb[data-state="listening"] {
  animation: breathe 2s ease-in-out infinite;
  box-shadow:
    inset 0 0 40px rgba(17, 20, 255, 0.5),
    inset 0 -30px 60px rgba(30, 10, 255, 0.4),
    0 0 80px rgba(9, 200, 25, 0.6),
    0 25px 60px rgba(0, 2, 80, 0.5);
}

    .orb[data-state="thinking"]::before {
      animation-duration: 1.5s;
    }

    .orb[data-state="speaking"] {
      transform: scale(calc(1 + var(--level) * 0.22));
    }

    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* test buttons */
    .controls { display: flex; gap: 12px; }
    button {
      background: #1a1a2e;
      color: #cfc6ff;
      border: 1px solid #3a2f7a;
      border-radius: 8px;
      padding: 8px 16px;
      cursor: pointer;
    }
    button:hover { background: #2a2250; }
    .stage {
  --level: 0;
  position: relative;
  display: grid;
  place-items: center;
}
.caption {
  min-height: 1.6em;
  max-width: 600px;
  margin: 0;
  text-align: center;
  color: #cfe6ff;
  font-size: 22px;
  text-shadow: 0 0 12px rgba(90, 180, 255, 0.6);
}

/* big soft halo behind the orb, brightens with voice level */
.stage::before {
  content: "";
  position: absolute;
  width: 540px;
  height: 540px;
  border-radius: 50%;
  background: radial-gradient(circle,
    rgba(70, 160, 255, 0.45) 0%,
    rgba(40, 100, 255, 0.18) 35%,
    transparent 65%);
  filter: blur(30px);
  opacity: calc(0.7 + var(--level) * 0.3);
  animation: halo 6s ease-in-out infinite;
}



/* glow on the floor under the orb */
.floor {
  position: absolute;
  bottom: -70px;
  width: 260px;
  height: 30px;
  border-radius: 50%;
  background: radial-gradient(ellipse, rgba(80, 170, 255, 0.5), transparent 70%);
  filter: blur(12px);
}

/* cinematic overlays: vignette + film grain */
html::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 10;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.65) 100%);
}

html::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 11;
  opacity: 0.08;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

@keyframes halo {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.08); }
}
#question {
  width: 320px;
  padding: 10px 14px;
  border-radius: 999px;
  border: 1px solid #3a5fa8;
  background: rgba(10, 20, 50, 0.6);
  color: #dbe9ff;
  font-size: 15px;
  outline: none;
}
#question:focus { box-shadow: 0 0 14px rgba(90, 180, 255, 0.6); }
.w {
  display: inline-block;
  margin-right: 0.3em;
  opacity: 0;
  animation-duration: 0.6s;
  animation-timing-function: ease-out;
  animation-fill-mode: forwards;
}
.w.rise { animation-name: rise; }
.w.blur { animation-name: blurin; }
.w.glow { animation-name: glowin; }
.w.scale { animation-name: scalein; }
.w.slide { animation-name: slidein; }
.w.flip  { animation-name: flipin; transform-origin: top; }
.w.drop  { animation-name: dropin; }

@keyframes scalein {
  from { opacity: 0; transform: scale(0.6); }
  to   { opacity: 1; transform: none; }
}
@keyframes slidein {
  from { opacity: 0; transform: translateX(-30px); }
  to   { opacity: 1; transform: none; }
}
@keyframes flipin {
  from { opacity: 0; transform: perspective(500px) rotateX(-80deg); }
  to   { opacity: 1; transform: none; }
}
@keyframes dropin {
  from { opacity: 0; transform: translateY(-26px); }
  to   { opacity: 1; transform: none; }
}
@keyframes rise {
  from { opacity: 0; transform: translateY(14px); }
  to   { opacity: 1; transform: none; }
}
@keyframes blurin {
  from { opacity: 0; filter: blur(10px); }
  to   { opacity: 1; filter: blur(0); }
}
@keyframes glowin {
  0%   { opacity: 0; }
  40%  { opacity: 1; color: #fff; text-shadow: 0 0 24px #7fd0ff, 0 0 44px #4aa8ff; }
  100% { opacity: 1; }
}
.hidden { display: none; }


#world {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
}
.card, .rect {
  position: absolute;
  left: 50%;
  top: 50%;
}
.card {
  width: 460px;
  padding: 26px 30px;
  box-sizing: border-box;
  border-radius: 14px;
  border: 1px solid rgba(150, 210, 255, 0.35);
  background: linear-gradient(135deg, rgba(60, 110, 220, 0.25), rgba(20, 40, 100, 0.22));
  box-shadow: 0 0 30px rgba(70, 150, 255, 0.18);
  opacity: 0.55;
  transition: opacity 0.5s, box-shadow 0.5s;
}
.card.active { opacity: 1; box-shadow: 0 0 44px rgba(90, 180, 255, 0.45); }
.card.done { opacity: 0.35; }
.card p {
  margin: 0;
  text-align: center;
  color: #e3f0ff;
  font-size: 26px;
  line-height: 1.3;
}
.rect {
  border: 1px solid rgba(130, 190, 255, 0.5);
  border-radius: 4px;
  background: rgba(80, 140, 255, 0.08);
  pointer-events: none;
}
.word { display: inline-block; margin-right: 0.3em; }
.hl {
  color: #8fdcff;
  font-weight: 700;
  text-shadow: 0 0 14px rgba(110, 200, 255, 0.8);
}
.c { opacity: 0; animation: charin 0.01s forwards; }
@keyframes charin { to { opacity: 1; } }
/* colors the page can change dynamically */
@property --base   { syntax: "<color>"; inherits: true; initial-value: #050a1a; }
@property --c1     { syntax: "<color>"; inherits: true; initial-value: rgba(40, 90, 255, 0.55); }
@property --c2     { syntax: "<color>"; inherits: true; initial-value: rgba(0, 210, 255, 0.4); }
@property --accent { syntax: "<color>"; inherits: true; initial-value: #8fdcff; }
:root {
  transition: --base 1.4s ease, --c1 1.4s ease, --c2 1.4s ease, --accent 1.4s ease;
}

/* full-page scene */
#scene-view {
  position: fixed;
  inset: 0;
  z-index: 5;            /* above the page, below the vignette and grain */
  perspective: 1200px;
  overflow: hidden;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.8s ease;
}
#scene-view.show { opacity: 1; }
#playback-controls {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  padding: 8px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 12px;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  box-shadow: 0 0 24px color-mix(in srgb, var(--accent) 18%, transparent);
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}
#playback-controls.show {
  opacity: 1;
  pointer-events: auto;
}
#playback-controls button {
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 8px;
  padding: 8px 12px;
  color: #e3f0ff;
  background: color-mix(in srgb, var(--accent) 10%, transparent);
  font: inherit;
  cursor: pointer;
}

.card {
  width: min(720px, 78vw);
  padding: 34px 40px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  background: linear-gradient(135deg,
    color-mix(in srgb, var(--accent) 16%, transparent),
    color-mix(in srgb, var(--c1) 30%, transparent));
  box-shadow: 0 0 30px color-mix(in srgb, var(--accent) 18%, transparent);
}
.card.active { box-shadow: 0 0 60px color-mix(in srgb, var(--accent) 50%, transparent); }
.card p { font-size: clamp(28px, 4.2vw, 60px); }
.line { animation: lineFade 0.4s ease-out both; }
@keyframes lineFade { from { opacity: 0; } to { opacity: 1; } }
.diagram {
  display: flex;
  gap: 12px;
  justify-content: center;
  margin-bottom: 22px;
}
.cell {
  pointer-events: auto;
  cursor: pointer;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  min-width: 70px;
  padding: 12px 14px;
  text-align: center;
  font-size: clamp(18px, 2.4vw, 32px);
  color: #e3f0ff;
  transition: opacity 0.4s, transform 0.4s, box-shadow 0.4s;
}
#tip {
  position: fixed;
  pointer-events: none;
  z-index: 20;
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 16px;
  color: #e3f0ff;
  background: rgba(10, 20, 50, 0.85);
  border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
  opacity: 0;
  transition: opacity 0.2s;
}
#tip.show { opacity: 1; }
.cell.on {
  transform: translateY(-8px) scale(1.08);
  box-shadow: 0 0 28px color-mix(in srgb, var(--accent) 70%, transparent);
}
.cell.dim { opacity: 0.35; }
.cell.changed { animation: cellFlip 0.6s ease-out; }
@keyframes cellFlip {
  0% { transform: perspective(400px) rotateX(-90deg); opacity: 0 }
  100% { transform: none; opacity: 1 }
}
.idx {
  font-size: 0.55em;
  opacity: 0.6;
  display: block;
  margin-top: 6px;
}
.rect {
  border-color: color-mix(in srgb, var(--accent) 50%, transparent);
  background: color-mix(in srgb, var(--accent) 8%, transparent);
}
.hl {
  color: var(--accent);
  text-shadow: 0 0 18px color-mix(in srgb, var(--accent) 80%, transparent);
}

/* orb leaves, scene plays, orb returns */
.stage, .controls, #question, .caption { transition: opacity 0.8s ease, transform 0.8s ease; }
body.takeover .stage { opacity: 0; transform: scale(0.6); pointer-events: none; }
body.takeover .controls,
body.takeover #question,
body.takeover .caption { opacity: 0; pointer-events: none; }
.card img {
  display: block;
  margin: 0 auto 18px;
  height: clamp(90px, 18vh, 190px);
  opacity: 0;
  transform: scale(0.6) translateY(20px);
  transition: opacity 0.5s ease, transform 0.6s cubic-bezier(0.2, 1.4, 0.4, 1);
}
.card.active img, .card.done img {
  opacity: 1;
  transform: none;
}
#beat-view {
  position: fixed;
  inset: 0;
  z-index: 6;
  display: grid;
  place-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.35s ease, background 0.25s ease;
  background: #000;
  overflow: hidden;
}
#beat-view.show { opacity: 1; }
#beat-view.palette { background: transparent; }
#beat-text {
  color: #fff;
  font-weight: 800;
  text-align: center;
  letter-spacing: -0.02em;
  line-height: 1;
  padding: 0 6vw;
}
#beat-text.hl {
  color: var(--accent);
  text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 80%, transparent);
}
#beat-flash {
  position: absolute;
  inset: 0;
  background: #fff;
  opacity: 0;
  pointer-events: none;
}
#beat-flash.go { animation: flashGo 0.14s ease-out; }
@keyframes flashGo { from { opacity: 0.55 } to { opacity: 0 } }
#beat-text.punch { animation: punchIn 0.2s cubic-bezier(0.2, 1.3, 0.4, 1) both; }
@keyframes punchIn { from { transform: scale(1.35); opacity: 0 } to { transform: none; opacity: 1 } }
#beat-text.drop { animation: dropIn 0.22s ease-out both; }
@keyframes dropIn { from { transform: translateY(-40px); opacity: 0 } to { transform: none; opacity: 1 } }
#diagram-view {
  position: fixed;
  inset: 0;
  z-index: 6;
  background: rgba(5, 10, 26, 0.92);
  opacity: 0;
  pointer-events: none;
  overflow: hidden;
  transition: opacity 0.4s;
}
#diagram-view.show { opacity: 1; }
#diagram-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}
#diagram-svg line {
  stroke: var(--accent);
  stroke-width: 3;
  opacity: 0;
  transition: opacity 0.5s;
}
#diagram-svg line.visible { opacity: 1; }
#diagram-svg line.on { filter: drop-shadow(0 0 8px var(--accent)); }
#diagram-objects .obj {
  position: absolute;
  transform: translate(-50%, -50%);
  opacity: 0;
  transition: opacity 0.5s, box-shadow 0.4s;
  color: #e3f0ff;
  text-align: center;
  font-size: clamp(18px, 2.4vw, 32px);
}
#diagram-objects .obj.visible { opacity: 1; }
#diagram-objects .obj.on { box-shadow: 0 0 28px var(--accent); }
.obj.box {
  padding: 14px 22px;
  border: 1px solid var(--accent);
  border-radius: 10px;
  background: color-mix(in srgb, var(--accent) 14%, transparent);
}
.obj.circle {
  width: clamp(80px, 10vw, 140px);
  height: clamp(80px, 10vw, 140px);
  border-radius: 50%;
  border: 1px solid var(--accent);
  background: color-mix(in srgb, var(--accent) 14%, transparent);
  display: grid;
  place-items: center;
}
.obj.label {
  border: none;
  background: none;
}
.obj.label.visible { opacity: 0.8; }
#diagram-say {
  position: absolute;
  bottom: 8vh;
  left: 0;
  right: 0;
  text-align: center;
  color: #e3f0ff;
  font-size: clamp(20px, 2.6vw, 38px);
  padding: 0 8vw;
  margin: 0;
}
  </style>
</head>
<body>
  <div class="stage">
    <div class="orb" data-state="idle"></div>
    <div class="floor"></div>
  </div>
  <p class="caption" id="caption"></p>
  <div id="scene-view">
    <div id="world"></div>
    <div id="playback-controls">
      <button id="pause-playback">Pause</button>
      <button id="skip-playback">Skip step</button>
      <button id="stop-playback">Stop</button>
    </div>
  </div>
  <div id="beat-view"><div id="beat-flash"></div><div id="beat-text"></div></div>
  <div id="diagram-view"><svg id="diagram-svg"></svg><div id="diagram-objects"></div><p id="diagram-say"></p></div>
  <input id="question" placeholder="Ask something, e.g. explain arrays" autocomplete="off">
  <div class="controls">
    <button data-set="idle">Idle</button>
    <button data-set="listening">Listening</button>
    <button data-set="thinking">Thinking</button>
    <button data-set="speaking">Speaking</button>
    <button id="demoBeats">Beats demo</button>
    <button id="demoDiagram">Diagram demo</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
